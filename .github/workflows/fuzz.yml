name: Fuzz

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {pkg: ./internal/config, name: FuzzParse}
          - {pkg: ./internal/header, name: FuzzEnsure}
          - {pkg: ./internal/imports, name: FuzzPrune}
          - {pkg: ./internal/scan, name: FuzzDirectives}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz for five minutes
        run: go test ${{ matrix.target.pkg }} -run '^$' -fuzz '^${{ matrix.target.name }}$' -fuzztime 5m
      # A failing input is saved under testdata/fuzz; commit it to keep it as a regression test.
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target.name }}-failure
          path: ${{ matrix.target.pkg }}/testdata/fuzz
