# yaml-language-server: $schema=https://raw.githubusercontent.com/typhonhilldev/adder/main/schema/adder-v1.json
version: 1

derive:
  scans:
    # Settings from .env files, read by this repository's own env-file scanner.
    Settings:
      scanner: {name: env-file, with: {files: [config/defaults.env]}}
  outputs:
    - template: templates/settings.go.tmpl
      path: config/settings.gen.go
