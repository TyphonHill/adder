version: 1

derive:
  scans:
    # Every exported New function in a package under drivers/ is a driver.
    Drivers:
      dirs: ["drivers/*"]
      funcs: {exported: true, name: ^New$}
  outputs:
    - template: templates/registry.go.tmpl
      path: drivers/drivers.gen.go

generators:
  driver:
    description: Add a storage driver
    inputs:
      name:
        help: Driver name, used as the package name
        pattern: "[a-z][a-z0-9]*"
        unique: Drivers.Package
      summary:
        help: What the driver stores values in, for its package documentation
        default: an external service
    files:
      - template: templates/new/driver.go.tmpl
        path: "drivers/{{ .Inputs.name }}/{{ .Inputs.name }}.go"
    message: Implement Get and Put in drivers/{{ .Inputs.name }}/{{ .Inputs.name }}.go. drivers.All includes it already.
    tests:
      - name: plain
        inputs: {name: example}
        want: testdata/generators/driver/plain
