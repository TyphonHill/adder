# yaml-language-server: $schema=https://raw.githubusercontent.com/typhonhilldev/adder/main/schema/adder-v1.json
version: 1

derive:
  scans:
    # Every exported constant in order/, with the type it is declared with.
    Constants:
      dirs: [order]
      values: {kind: const, exported: true}
  outputs:
    - template: templates/strings.go.tmpl
      path: order/strings.gen.go
