version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - modernize
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        # adder reads templates and source files from paths the user configures.
        - G304
        # Generated sources get normal source tree permissions (0755 dirs, 0644 files).
        - G301
        - G302
        - G306
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: receiver-naming
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - gosec
      # A copy of Go's internal/diff, kept identical to its source so it can be compared and updated.
      - path: internal/diff/diff\.go
        linters:
          - modernize

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/TyphonHill/adder
